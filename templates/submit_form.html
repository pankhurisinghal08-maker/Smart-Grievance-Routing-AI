<!DOCTYPE html>
<html>
<head>
    <title>Submit Grievance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center text-white">Student Grievance Form</h2>
        
        <form action="/submit" method="POST" class="form-container">
            <div class="mb-3">
                <label class="form-label">Your Roll Number</label>
                <input type="text" name="roll_number" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Describe your problem</label>
                <textarea name="description" class="form-control" rows="5" required></textarea>
                <small id="char-count" class="text-muted">500 character(s) left</small>
            </div>
            
            <button type="submit" class="btn btn-orange w-100">Submit</button>
        </form>
    </div>
    
    <script src="{{ url_for('static', filename='custom.js') }}"></script>
</body>
</html>
