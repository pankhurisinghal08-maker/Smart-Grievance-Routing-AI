<!DOCTYPE html>
<html>
<head>
    <title>Submit Grievance</title>
    <!-- This link brings in Bootstrap for nice, instant designs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4">Student Grievance Form</h2>
        
        <!-- The form sends data to your Python server -->
        <form action="/submit" method="POST" class="bg-white p-4 shadow rounded">
            
            <div class="mb-3">
                <label class="form-label">Your Roll Number</label>
                <input type="text" name="roll_number" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Describe your problem</label>
                <textarea name="description" class="form-control" rows="5" required></textarea>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Submit</button>
            
        </form>
    </div>
</body>
</html>
