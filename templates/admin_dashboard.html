<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <!-- Bootstrap for clean tables and colors -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">Admin Dashboard - Grievances</h2>
        
        <!-- Creates a clean grid to organize complaints -->
        <table class="table table-bordered bg-white shadow">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Roll Number</th>
                    <th>Complaint</th>
                    <th>Department (AI Guess)</th>
                    <th>Priority</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <!-- Python will automatically put the real database info here later -->
                <tr>
                    <td>1</td>
                    <td>123456</td>
                    <td>The projector in Room 101 is broken.</td>
                    <td>IT Department</td>
                    <td>Normal</td>
                    <td>Pending</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
